<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RiskPulse AI architecture</title>
  <desc id="desc">Diagram showing synthetic policy data flowing through deterministic risk, pricing, leakage, underwriting, AI brief, and frontend layers.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020817" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">RiskPulse AI Architecture</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Synthetic policy data to underwriting decision support</text>

  <g filter="url(#shadow)">
    <rect x="60" y="120" width="220" height="120" rx="18" fill="url(#panel)" stroke="#1e293b"/>
    <text x="170" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Synthetic Policy Data</text>
    <text x="170" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">customer, policy, claims,</text>
    <text x="170" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">vehicle, telematics, premium</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="120" width="220" height="120" rx="18" fill="url(#panel)" stroke="#1e293b"/>
    <text x="450" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Risk Scoring</text>
    <text x="450" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">calculateRiskProfile()</text>
    <text x="450" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">score + factor breakdown</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="120" width="220" height="120" rx="18" fill="url(#panel)" stroke="#1e293b"/>
    <text x="730" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Adaptive Pricing</text>
    <text x="730" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">calculateRecommendedPremium()</text>
    <text x="730" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">recommended premium</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="120" width="220" height="120" rx="18" fill="url(#panel)" stroke="#1e293b"/>
    <text x="1010" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Rating Leakage</text>
    <text x="1010" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">detectRatingLeakage()</text>
    <text x="1010" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">amount + severity</text>
  </g>

  <line x1="280" y1="180" x2="340" y2="180" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="560" y1="180" x2="620" y2="180" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="840" y1="180" x2="900" y2="180" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="270" y="310" width="260" height="130" rx="18" fill="url(#panel)" stroke="#1e293b"/>
    <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Underwriting Decision</text>
    <text x="400" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">determineUnderwritingDecision()</text>
    <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">APPROVE / REVIEW / REFER</text>
    <text x="400" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">recommended action</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="310" width="260" height="130" rx="18" fill="url(#panel)" stroke="#1e293b"/>
    <text x="750" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">AI Underwriter Brief</text>
    <text x="750" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">createUnderwriterBrief()</text>
    <text x="750" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">decision support summary</text>
    <text x="750" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">human review action</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="220" y="520" width="760" height="140" rx="18" fill="url(#panel)" stroke="#1e293b"/>
    <text x="600" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Frontend: React + TypeScript + Vite + Tailwind</text>
    <text x="600" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Dashboard, review table, policy detail workspace, AI brief, what-if simulator</text>
    <text x="600" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Data fetched from API, rendered with INR currency formatting and policy-level context</text>
    <text x="600" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Human underwriter decides final action</text>
  </g>

  <line x1="450" y1="240" x2="450" y2="310" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="730" y1="240" x2="730" y2="310" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1010" y1="240" x2="1010" y2="310" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>

  <line x1="530" y1="375" x2="620" y2="375" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="750" y1="440" x2="750" y2="520" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>

  <g>
    <rect x="170" y="260" width="160" height="26" rx="13" fill="#0f172a" stroke="#22d3ee"/>
    <text x="250" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#67e8f9">deterministic pipeline</text>
  </g>

  <g>
    <rect x="640" y="260" width="200" height="26" rx="13" fill="#0f172a" stroke="#38bdf8"/>
    <text x="740" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#bae6fd">AI-assisted support layer</text>
  </g>

  <g>
    <rect x="510" y="680" width="220" height="26" rx="13" fill="#0f172a" stroke="#22c55e"/>
    <text x="620" y="698" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#86efac">human underwriter decision</text>
  </g>
</svg>
